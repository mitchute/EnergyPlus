name: C/C++ CI

on:
  push:
    branches: [ develop ]
  pull_request:
    branches: [ develop ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout
    - name: cmake
      run: mkdir build && cd build && cmake ..
    - name: build
      run: make energyplus
    - name: test
      run: cd Products && ./energyplus -D ../../testfiles/1ZoneUncontrolled.idf
